<style>
/* ==========================================
   LIQUID GLASS DESIGN TOKENS
   ========================================== */
:root {
  /* Dark Mode Default (Liquid Glass feels best on dark) */
  --bg-deep: #0a0c12;
  --bg-base: #0f1119;
  --fg-primary: #f1f5f9;
  --fg-muted: #94a3b8;
  --fg-subtle: #64748b;
  --accent: #6366f1; --accent-glow: #818cf8;
  --accent-2: #ec4899; --accent-2-glow: #f472b6;
  --glass-bg: rgba(15, 18, 25, 0.55);
  --glass-bg-strong: rgba(15, 18, 25, 0.75);
  --glass-border: rgba(255, 255, 255, 0.08);
  --glass-highlight: rgba(255, 255, 255, 0.12);
  --glass-hover: rgba(255, 255, 255, 0.05);
  --shadow-glass: 0 4px 30px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.03);
  --shadow-glass-hover: 0 12px 50px rgba(0,0,0,0.4), 0 4px 10px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.08);
  --radius-xl: 1.25rem; --radius-2xl: 1.5rem;
  --font-sans: 'Geist', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --transition-smooth: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --transition-spring: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* Light Mode Override */
html.light {
  --bg-deep: #f8fafc; --bg-base: #ffffff;
  --fg-primary: #0f172a; --fg-muted: #475569; --fg-subtle: #94a3b8;
  --glass-bg: rgba(255, 255, 255, 0.65);
  --glass-bg-strong: rgba(255, 255, 255, 0.85);
  --glass-border: rgba(15, 23, 42, 0.06);
  --glass-highlight: rgba(255, 255, 255, 0.5);
  --glass-hover: rgba(15, 23, 42, 0.03);
  --shadow-glass: 0 4px 30px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03), inset 0 1px 0 rgba(255,255,255,0.5);
  --shadow-glass-hover: 0 12px 50px rgba(0,0,0,0.08), 0 4px 10px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,0.8);
}

/* ==========================================
   BASE & RESET
   ========================================== */
*, *::before, *::after { box-sizing: border-box; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }

html, body, #root { height: 100%; width: 100%; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background: var(--bg-deep);
  color: var(--fg-primary);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: hidden; /* App handles scrolling */
  background-image: 
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.15), transparent),
    radial-gradient(ellipse 60% 40% at 100% 100%, rgba(236, 72, 153, 0.1), transparent);
  background-attachment: fixed;
}

/* ==========================================
   GLASS UTILITIES (Reusable via Class)
   ========================================== */
.glass-pane {
  background: var(--glass-bg);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-glass);
  position: relative; overflow: hidden;
  transition: all var(--transition-smooth);
}
.glass-pane-elevated { background: var(--glass-bg-strong); border-color: var(--glass-highlight); box-shadow: var(--shadow-glass-hover); }
.glass-pane-floating { backdrop-filter: blur(60px) saturate(200%); -webkit-backdrop-filter: blur(60px) saturate(200%); }

/* Noise Texture Overlay (The "Grain" of real glass) */
.glass-pane::before, .glass-pane-elevated::before, .glass-pane-floating::before {
  content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; opacity: 0.035;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  border-radius: inherit;
}

/* Specular Highlight (The "Shine" on hover) */
.specular { --mx: 50%; --my: 50%; }
.specular::after {
  content: ""; position: absolute; inset: -50%; z-index: 2; pointer-events: none; opacity: 0;
  background: radial-gradient(ellipse at var(--mx) var(--my), rgba(255,255,255,0.1) 0%, transparent 65%);
  border-radius: inherit; transition: opacity 0.4s ease;
}
.specular:hover::after { opacity: 1; }

/* Inner Bevel Highlight (Top/Left Edge) */
.glass-pane > .inner-glow, .glass-pane-elevated > .inner-glow, .glass-pane-floating > .inner-glow {
  position: absolute; inset: 0; pointer-events: none; z-index: 3; border-radius: inherit; overflow: hidden;
}
.glass-pane > .inner-glow::before, .glass-pane-elevated > .inner-glow::before, .glass-pane-floating > .inner-glow::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
}
.glass-pane > .inner-glow::after, .glass-pane-elevated > .inner-glow::after, .glass-pane-floating > .inner-glow::after {
  content: ""; position: absolute; top: 0; left: 0; bottom: 0; width: 1px;
  background: linear-gradient(180deg, transparent, rgba(255,255,255,0.15), transparent);
}

/* Scrollbars */
.glass-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
.glass-scroll::-webkit-scrollbar-track { background: transparent; }
.glass-scroll::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 3px; border: 2px solid transparent; background-clip: content-box; }
.glass-scroll::-webkit-scrollbar-thumb:hover { background: var(--glass-highlight); }

/* ==========================================
   ANIMATIONS
   ========================================== */
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes shimmer { 100% { transform: translateX(100%); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes spin { to { transform: rotate(360deg); } }
.animate-float { animation: float 6s ease-in-out infinite; }
.animate-shimmer::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent); transform: translateX(-100%); animation: shimmer 2s infinite; }
.animate-fade-up { animation: fadeUp 0.6s var(--transition-smooth) forwards; opacity: 0; }
.delay-1 { animation-delay: 0.1s; } .delay-2 { animation-delay: 0.2s; } .delay-3 { animation-delay: 0.3s; } .delay-4 { animation-delay: 0.4s; }

/* Focus Visible */
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* Reader Specific */
.reader-view { font-family: var(--font-sans); line-height: 1.75; font-size: 1.125rem; color: var(--fg-primary); }
.reader-view h1, .reader-view h2, .reader-view h3 { line-height: 1.3; font-weight: 600; margin-top: 2em; margin-bottom: 0.5em; color: var(--fg-primary); }
.reader-view h1 { font-size: 2.25rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 0.5rem; }
.reader-view h2 { font-size: 1.75rem; }
.reader-view p { margin: 1em 0; text-align: justify; text-justify: inter-word; }
.reader-view code { font-family: var(--font-mono); background: var(--glass-bg); padding: 0.15em 0.4em; border-radius: 0.25rem; font-size: 0.9em; border: 1px solid var(--glass-border); }
.reader-view pre { background: #05070c; border: 1px solid var(--glass-border); border-radius: var(--radius-xl); padding: 1.5rem; overflow-x: auto; margin: 1.5rem 0; }
.reader-view pre code { background: transparent; padding: 0; border: none; font-size: 0.875rem; line-height: 1.6; }
.reader-view blockquote { border-left: 3px solid var(--accent); padding-left: 1rem; margin: 1.5rem 0; color: var(--fg-muted); font-style: italic; }
.reader-view img { max-width: 100%; border-radius: var(--radius-xl); margin: 1.5rem auto; display: block; box-shadow: var(--shadow-glass); }
.reader-view a { color: var(--accent-glow); text-decoration: none; border-bottom: 1px dashed transparent; transition: border-color 0.2s; }
.reader-view a:hover { border-bottom-color: var(--accent-glow); }

/* Septia Theme for Reader */
html.sepia .reader-view { --fg-primary: #433422; --bg-deep: #fdf6e3; --bg-base: #fefae0; color: #433422; }
html.sepia .reader-view h1, html.sepia .reader-view h2, html.sepia .reader-view h3 { color: #2c2010; }
html.sepia .reader-view code { background: #e8dfc9; border-color: #d4c9b0; }
html.sepia .reader-view pre { background: #2c2010; border-color: #d4c9b0; }
html.sepia .reader-view blockquote { border-color: #d4a843; color: #6b5b3a; }
html.sepia .glass-pane { --glass-bg: rgba(254, 250, 224, 0.7); --glass-border: rgba(44, 32, 16, 0.1); --glass-highlight: rgba(255,255,255,0.5); box-shadow: 0 4px 30px rgba(0,0,0,0.05); }
html.sepia body { background: #fdf6e3; background-image: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(212, 168, 67, 0.15), transparent); }

</style>

<script type="module">
import { openDB } from 'https://cdn.jsdelivr.net/npm/idb@7/+esm';
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/+esm';
import { default as Epub } from 'https://cdn.jsdelivr.net/npm/epubjs@0.3.93/+esm';
import { marked } from 'https://cdn.jsdelivr.net/npm/marked@12/+esm';
import DOMPurify from 'https://cdn.jsdelivr.net/npm/dompurify@3/+esm';

// ==========================================
// CONFIGURATION
// ==========================================
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs';
const DB_NAME = 'SnapLearnDB';
const STORE_BOOKS = 'books';
const STORE_PROGRESS = 'progress';

// ==========================================
// INDEXEDDB WRAPPER (Unlimited Storage)
// ==========================================
let dbPromise = null;
async function getDB() {
  if (dbPromise) return dbPromise;
  dbPromise = openDB(DB_NAME, 1, {
    upgrade(db) {
      if (!db.objectStoreNames.contains(STORE_BOOKS)) {
        const store = db.createObjectStore(STORE_BOOKS, { keyPath: 'id' });
        store.createIndex('title', 'title');
        store.createIndex('type', 'type');
        store.createIndex('addedAt', 'addedAt');
      }
      if (!db.objectStoreNames.contains(STORE_PROGRESS)) {
        db.createObjectStore(STORE_PROGRESS, { keyPath: 'bookId' });
      }
    },
  });
  return dbPromise;
}

async function saveBook(file, metadata, contentBlob) {
  const db = await getDB();
  const id = crypto.randomUUID();
  const book = {
    id,
    title: metadata.title || file.name.replace(/\.[^/.]+$/, ""),
    author: metadata.author || "Unknown",
    type: metadata.type || file.type || 'application/octet-stream',
    cover: metadata.cover || null, // Base64 Data URL
    fileSize: file.size,
    addedAt: Date.now(),
    updatedAt: Date.now(),
    // Store file as Blob directly in IDB (efficient for large files)
    fileBlob: contentBlob, 
    // Extracted text for search (first 500k chars to save space)
    searchText: metadata.searchText?.substring(0, 500000) || '',
    pageCount: metadata.pageCount || 0,
  };
  await db.put(STORE_BOOKS, book);
  return book;
}

async function getBooks() {
  const db = await getDB();
  return db.getAllFromIndex(STORE_BOOKS, 'addedAt'); // Newest first
}

async function getBook(id) {
  const db = await getDB();
  return db.get(STORE_BOOKS, id);
}

async function deleteBook(id) {
  const db = await getDB();
  await db.delete(STORE_BOOKS, id);
  await db.delete(STORE_PROGRESS, id);
}

async function saveProgress(bookId, location, percentage) {
  const db = await getDB();
  await db.put(STORE_PROGRESS, { bookId, location, percentage, timestamp: Date.now() });
}

async function getProgress(bookId) {
  const db = await getDB();
  return db.get(STORE_PROGRESS, bookId);
}

// ==========================================
// STATE MANAGEMENT (Reactive Proxy)
// ==========================================
const state = {
  view: 'dashboard', // dashboard, library, reader, settings
  sidebarOpen: true,
  sidebarCollapsed: false,
  theme: 'dark', // dark, light, sepia
  books: [],
  selectedBook: null,
  reader: { 
    instance: null, // pdfjs doc or epub rendition
    type: null, 
    currentLocation: null, 
    totalPages: 0,
    fontSize: 100,
    theme: 'dark',
    toc: [],
    searchQuery: '',
    searchResults: [],
    searchIndex: -1,
  },
  uploadProgress: 0,
  isUploading: false,
  stats: { totalBooks: 0, totalHours: 0, streak: 0, xp: 0 },
};

// Simple Reactivity System
const listeners = new Set();
function emit() { listeners.forEach(fn => fn()); }
function subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); }
function setState(patch) { Object.assign(state, patch); emit(); }

// ==========================================
// PARSING ENGINE (Web Workers via pdfjs/epubjs)
// ==========================================
async function parseTextbook(file) {
  setState({ isUploading: true, uploadProgress: 10 });
  
  const type = file.type;
  let metadata = { title: file.name, searchText: '', pageCount: 0, cover: null };

  try {
    if (type === 'application/pdf') {
      metadata = await parsePDF(file);
    } else if (type === 'application/epub+zip' || file.name.endsWith('.epub')) {
      metadata = await parseEPUB(file);
    } else if (type === 'text/markdown' || type === 'text/plain' || file.name.endsWith('.md') || file.name.endsWith('.txt')) {
      metadata = await parseText(file);
    } else {
      throw new Error(`Unsupported file type: ${type}`);
    }
  } catch (e) {
    console.error("Parse Error:", e);
    alert(`Failed to parse ${file.name}: ${e.message}`);
    setState({ isUploading: false });
    return null;
  }

  setState({ uploadProgress: 90 });
  const book = await saveBook(file, metadata, file); // Store original file blob
  setState({ isUploading: false, uploadProgress: 0 });
  return book;
}

async function parsePDF(file) {
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  let fullText = '';
  const numPages = pdf.numPages;
  
  // Extract text from first few pages for cover/preview + all for search
  for (let i = 1; i <= Math.min(numPages, 5); i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    fullText += content.items.map(s => s.str).join(' ') + '\n\n';
  }
  // Generate Cover Thumbnail (Page 1)
  const page1 = await pdf.getPage(1);
  const viewport = page1.getViewport({ scale: 0.4 });
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width; canvas.height = viewport.height;
  await page1.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  const cover = canvas.toDataURL('image/webp', 0.8);

  // Extract ALL text for search (background)
  // Note: In production, do this in a Web Worker to not block UI. 
  // For this standalone demo, we do a quick sample.
  let searchText = fullText;
  if (numPages > 5) {
     // Just grab a sample from middle/end for demo speed
     const mid = await pdf.getPage(Math.floor(numPages/2)).then(p => p.getTextContent());
     const end = await pdf.getPage(numPages).then(p => p.getTextContent());
     searchText += mid.items.map(s=>s.str).join(' ') + end.items.map(s=>s.str).join(' ');
  }

  return { title: pdf.metadata?.info?.Title || file.name, pageCount: numPages, cover, searchText, type: 'pdf' };
}

async function parseEPUB(file) {
  // EpubJS needs a URL. Create Object URL.
  const url = URL.createObjectURL(file);
  const book = Epub(url);
  await book.ready;
  
  const metadata = book.package.metadata;
  const toc = await book.navigation.getToc();
  const pageCount = toc.length; // Approximation
  
  // Get Cover
  let cover = null;
  const coverUrl = book.coverUrl();
  if (coverUrl) {
    try { 
      const resp = await fetch(coverUrl); 
      const blob = await resp.blob(); 
      cover = URL.createObjectURL(blob); // Use blob URL for cover
    } catch(e) { /* ignore */ }
  }

  // Extract Text for Search (Rendition is heavy, parse spine items)
  // Simplified: Grab text from first few spine items
  let searchText = '';
  const spine = book.spine.spineItems.slice(0, 5);
  for (const item of spine) {
    try {
      const content = await book.load.bind(book)(item.href); // Internal load
      // Actually easier: use book.rendition but that's heavy. 
      // For demo, we skip full text extraction for EPUB to keep it fast.
      // Real app: Use a worker to parse spine XML.
    } catch(e) {}
  }

  URL.revokeObjectURL(url); // Cleanup
  return { title: metadata.title || file.name, author: metadata.creator, pageCount, cover, searchText, type: 'epub' };
}

async function parseText(file) {
  const text = await file.text();
  const html = DOMPurify.sanitize(marked.parse(text));
  // Create a temporary div to extract text content for search
  const div = document.createElement('div');
  div.innerHTML = html;
  const searchText = div.innerText;
  return { title: file.name, searchText, type: 'markdown', pageCount: 1, cover: null };
}

// ==========================================
// RENDERER (Vanilla DOM + Animation Helpers)
// ==========================================
const app = document.getElementById('app');
let rafId = null;

function render() {
  // Theme Application
  document.documentElement.classList.toggle('light', state.theme === 'light');
  document.documentElement.classList.toggle('sepia', state.theme === 'sepia' && state.view === 'reader');
  
  // Main Layout
  app.innerHTML = `
    <aside id="sidebar" class="${sidebarClasses()}" role="navigation" aria-label="Main Navigation">
      ${renderSidebar()}
    </aside>
    <main id="main" class="${mainClasses()}" role="main">
      ${renderTopBar()}
      <div class="p-4 md:p-6 lg:p-8 overflow-y-auto h-[calc(100%-4rem)] glass-scroll">
        ${renderView()}
      </div>
    </main>
    ${state.view === 'reader' ? renderReaderOverlay() : ''}
  `;
  
  // Hydrate Lucide Icons
  lucide.createIcons({ attrs: { 'stroke-width': 1.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' } });
  
  // Bind Events
  bindEvents();
  
  // Animate Entrance
  requestAnimationFrame(() => {
    document.querySelectorAll('.animate-fade-up').forEach((el, i) => {
      el.style.animationDelay = `${i * 50}ms`;
    });
  });
}

function sidebarClasses() {
  let cls = 'fixed left-0 top-0 z-40 h-full flex flex-col transition-all duration-300 ease-out border-r border-glass-border glass-pane-elevated';
  cls += state.sidebarCollapsed ? ' w-16' : ' w-72';
  if (!state.sidebarOpen) cls += ' -translate-x-full lg:translate-x-0';
  return cls;
}
function mainClasses() {
  let cls = 'flex-1 flex flex-col overflow-hidden transition-all duration-300 ease-out';
  cls += state.sidebarCollapsed ? ' lg:ml-16' : ' lg:ml-72';
  return cls;
}

// ==========================================
// VIEW RENDERERS
// ==========================================
function renderSidebar() {
  return `
    <div class="flex items-center justify-between h-16 px-4 border-b border-glass-border flex-shrink-0">
      <div class="flex items-center gap-2 text-white font-bold text-lg overflow-hidden whitespace-nowrap ${state.sidebarCollapsed ? 'opacity-0 w-0 pointer-events-none' : ''}">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-indigo-500 to-pink-500 flex items-center justify-center flex-shrink-0">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
        </div>
        SnapLearn
      </div>
      <button id="btn-toggle-sidebar" class="text-muted-foreground hover:text-white p-2 rounded-lg hover:bg-white/5 transition-colors" aria-label="${state.sidebarCollapsed ? 'Expand' : 'Collapse'} Sidebar">
        <i data-lucide="${state.sidebarCollapsed ? 'chevron-right' : 'chevron-left'}" class="w-5 h-5"></i>
      </button>
    </div>
    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto glass-scroll ${state.sidebarCollapsed ? 'items-center' : ''}" style="flex-direction: column;">
      ${NavItem('/dashboard', 'LayoutDashboard', 'Dashboard', state.view === 'dashboard')}
      ${NavItem('/library', 'Library', 'My Library', state.view === 'library')}
      ${NavItem('/progress', 'TrendingUp', 'Progress', state.view === 'progress')}
      ${NavItem('/settings', 'Settings', 'Settings', state.view === 'settings')}
    </nav>
    <div class="p-3 border-t border-glass-border flex-shrink-0 ${state.sidebarCollapsed ? 'flex justify-center' : ''}">

// ==========================================
// EVENT BINDING & LOGIC
// ==========================================
function bindEvents() {
  // Sidebar Toggle
  document.getElementById('btn-toggle-sidebar')?.addEventListener('click', () => setState({ sidebarCollapsed: !state.sidebarCollapsed }));
  document.getElementById('btn-mobile-menu')?.addEventListener('click', () => setState({ sidebarOpen: !state.sidebarOpen }));
  
  // Navigation
  document.querySelectorAll('.nav-btn').forEach(btn => btn.addEventListener('click', () => {
    const route = btn.dataset.route;
    navigate(route);
    if (window.innerWidth < 1024) setState({ sidebarOpen: false });
  }));

  // Theme Toggle (Sidebar)
  document.getElementById('btn-theme')?.addEventListener('click', cycleTheme);

  // Upload
  document.getElementById('btn-upload')?.addEventListener('click', () => document.getElementById('file-input').click());
  document.getElementById('file-input')?.addEventListener('change', handleFiles);

  // Action Buttons (Dashboard)
  document.querySelectorAll('.action-btn').forEach(btn => btn.addEventListener('click', () => handleAction(btn.dataset.action)));

  // Library Cards
  document.querySelectorAll('[data-action="read"]').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); openReader(btn.dataset.bookId); }));
  document.querySelectorAll('[data-action="delete"]').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); confirmDelete(btn.dataset.bookId); }));
  document.querySelectorAll('[data-action="resume"]').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); openReader(btn.dataset.bookId); }));

  // Settings
  document.querySelectorAll('.theme-option').forEach(btn => btn.addEventListener('click', () => setState({ theme: btn.dataset.theme })));
  document.getElementById('btn-export')?.addEventListener('click', exportLibrary);
  document.getElementById('btn-clear')?.addEventListener('click', clearAllData);

  // Reader Controls
  document.getElementById('btn-close-reader')?.addEventListener('click', closeReader);
  document.getElementById('btn-toc')?.addEventListener('click', () => toggleTOC(true));
  document.getElementById('btn-close-toc')?.addEventListener('click', () => toggleTOC(false));
  document.querySelectorAll('#reader-overlay [data-theme]').forEach(btn => btn.addEventListener('click', () => setReaderTheme(btn.dataset.theme)));
  document.querySelectorAll('#reader-overlay [data-font]').forEach(btn => btn.addEventListener('click', () => adjustFont(btn.dataset.font)));
  document.getElementById('reader-search')?.addEventListener('input', debounce(handleReaderSearch, 300));
  document.querySelectorAll('.toc-link').forEach(a => a.addEventListener('click', (e) => { e.preventDefault(); navigateTOC(a.dataset.href, a.dataset.index); }));
  
  // Global Search
  document.getElementById('global-search')?.addEventListener('input', debounce(handleGlobalSearch, 300));

  // Click outside TOC to close (Mobile)
  document.getElementById('reader-overlay')?.addEventListener('click', (e) => {
    if (e.target === document.getElementById('reader-overlay')) closeReader();
  });
}

// --- Navigation ---
function navigate(route) {
  const views = { '/dashboard': 'dashboard', '/library': 'library', '/progress': 'progress', '/settings': 'settings' };
  setState({ view: views[route] || 'dashboard' });
}

// --- Theme ---
function cycleTheme() {
  const themes = ['dark', 'light', 'sepia'];
  const i = themes.indexOf(state.theme);
  setState({ theme: themes[(i + 1) % themes.length] });
}
function setReaderTheme(t) {
  state.reader.theme = t;
  document.documentElement.classList.toggle('sepia', t === 'sepia');
  document.documentElement.classList.toggle('light', t === 'light');
  render(); // Re-render reader content with new theme
}

// --- File Handling ---
async function handleFiles(e) {
  const files = Array.from(e.target.files);
  if (!files.length) return;
  e.target.value = ''; // Reset input
  
  for (const file of files) {
    if (file.size > 500 * 1024 * 1024) { alert(`${file.name} is too large (>500MB).`); continue; }
    await parseTextbook(file);
  }
  await refreshBooks();
}

async function refreshBooks() {
  const books = await getBooks();
  setState({ books, stats: { ...state.stats, totalBooks: books.length } });
}

// --- Actions ---
function handleAction(action) {
  if (action === 'upload') document.getElementById('file-input').click();
  else if (action === 'import') document.getElementById('import-file').click();
  else if (action === 'export') exportLibrary();
}

async function exportLibrary() {
  const books = await getBooks();
  const progress = await getDB().then(db => db.getAll(STORE_PROGRESS));
  const data = { books: books.map(b => ({...b, fileBlob: undefined})), progress, exportedAt: Date.now() }; // Exclude blobs for JSON portability
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `snaplearn-backup-${Date.now()}.json`; a.click();
  URL.revokeObjectURL(url);
}

window.handleImport = async (e) => {
  const file = e.target.files[0]; if (!file) return;
  const text = await file.text();
  try {
    const data = JSON.parse(text);
    const db = await getDB();
    const tx = db.transaction([STORE_BOOKS, STORE_PROGRESS], 'readwrite');
    // Note: This import restores METADATA only. Actual file blobs are NOT restored via JSON.
    // For full backup, use IndexedDB export (idb dump) or File System Access API (not in this scope).
    for (const b of data.books || []) await tx.objectStore(STORE_BOOKS).put({...b, fileBlob: null, cover: b.cover}); 
    for (const p of data.progress || []) await tx.objectStore(STORE_PROGRESS).put(p);
    await tx.done;
    alert('Metadata imported! Note: Actual book files must be re-uploaded.');
    await refreshBooks();
  } catch (err) { alert('Invalid backup file'); }
  e.target.value = '';
}

async function clearAllData() {
  if (!confirm('DELETE ALL BOOKS AND PROGRESS? This cannot be undone.')) return;
  const db = await getDB();
  await db.clear(STORE_BOOKS);
  await db.clear(STORE_PROGRESS);
  await refreshBooks();
  setState({ view: 'library' });
}

async function confirmDelete(id) {
  if (!confirm('Delete this textbook permanently?')) return;
  await deleteBook(id);
  await refreshBooks();
}
