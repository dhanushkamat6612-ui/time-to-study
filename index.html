<!-- CRITICAL: Inline CSS for Instant Paint (No FOUC) -->
<style>
/* ===== LIQUID GLASS DESIGN TOKENS ===== */
:root {
  --bg-deep: #0a0c12; --bg-base: #0f1119; --fg-primary: #f1f5f9; --fg-muted: #94a3b8; --fg-subtle: #64748b;
  --accent: #6366f1; --accent-glow: #818cf8; --accent-2: #ec4899;
  --glass-bg: rgba(15, 18, 25, 0.55); --glass-bg-strong: rgba(15, 18, 25, 0.75);
  --glass-border: rgba(255, 255, 255, 0.08); --glass-highlight: rgba(255, 255, 255, 0.12);
  --shadow-glass: 0 4px 30px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.03);
  --shadow-glass-hover: 0 12px 50px rgba(0,0,0,0.4), 0 4px 10px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.08);
  --radius-xl: 1.25rem; --radius-2xl: 1.5rem;
  --font-sans: 'Geist', system-ui, sans-serif; --font-mono: 'JetBrains Mono', monospace;
  --transition-smooth: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
html.light { --bg-deep: #f8fafc; --bg-base: #ffffff; --fg-primary: #0f172a; --fg-muted: #475569; --fg-subtle: #94a3b8; --glass-bg: rgba(255, 255, 255, 0.65); --glass-bg-strong: rgba(255, 255, 255, 0.85); --glass-border: rgba(15, 23, 42, 0.06); --glass-highlight: rgba(255, 255, 255, 0.5); --shadow-glass: 0 4px 30px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03), inset 0 1px 0 rgba(255,255,255,0.5); --shadow-glass-hover: 0 12px 50px rgba(0,0,0,0.08), 0 4px 10px rgba(0,0,0,0.05), inset 0 1px 0 rgba(255,255,255,0.8); }
html.sepia { --bg-deep: #fdf6e3; --bg-base: #fefae0; --fg-primary: #433422; --fg-muted: #6b5b3a; --glass-bg: rgba(254, 250, 224, 0.7); --glass-border: rgba(44, 32, 16, 0.1); }

/* ===== BASE ===== */
*, *::before, *::after { box-sizing: border-box; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
html, body, #app { height: 100%; width: 100%; margin: 0; padding: 0; }
body { font-family: var(--font-sans); background: var(--bg-deep); color: var(--fg-primary); -webkit-font-smoothing: antialiased; overflow: hidden; background-image: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.15), transparent), radial-gradient(ellipse 60% 40% at 100% 100%, rgba(236, 72, 153, 0.1), transparent); background-attachment: fixed; }

/* ===== GLASS UTILITIES ===== */
.glass { background: var(--glass-bg); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 1px solid var(--glass-border); border-radius: var(--radius-xl); box-shadow: var(--shadow-glass); position: relative; overflow: hidden; transition: all var(--transition-smooth); }
.glass-strong { background: var(--glass-bg-strong); border-color: var(--glass-highlight); box-shadow: var(--shadow-glass-hover); }
.glass-float { backdrop-filter: blur(60px) saturate(200%); -webkit-backdrop-filter: blur(60px) saturate(200%); }

/* Noise Texture */
.glass::before, .glass-strong::before, .glass-float::before { content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; opacity: 0.035; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); border-radius: inherit; }

/* Specular Highlight (Mouse Shine) */
.specular { --mx: 50%; --my: 50%; }
.specular::after { content: ""; position: absolute; inset: -50%; z-index: 2; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at var(--mx) var(--my), rgba(255,255,255,0.1) 0%, transparent 65%); border-radius: inherit; transition: opacity 0.4s ease; }
.specular:hover::after { opacity: 1; }

/* Inner Bevel */
.glass > .glow, .glass-strong > .glow, .glass-float > .glow { position: absolute; inset: 0; pointer-events: none; z-index: 3; border-radius: inherit; overflow: hidden; }
.glass > .glow::before, .glass-strong > .glow::before, .glass-float > .glow::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent); }
.glass > .glow::after, .glass-strong > .glow::after, .glass-float > .glow::after { content: ""; position: absolute; top: 0; left: 0; bottom: 0; width: 1px; background: linear-gradient(180deg, transparent, rgba(255,255,255,0.15), transparent); }

/* Scrollbars */
.glass-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
.glass-scroll::-webkit-scrollbar-track { background: transparent; }
.glass-scroll::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 3px; border: 2px solid transparent; background-clip: content-box; }
.glass-scroll::-webkit-scrollbar-thumb:hover { background: var(--glass-highlight); }

/* Animations */
@keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes spin { to { transform: rotate(360deg); } }
.animate-fade-up { animation: fadeUp 0.6s var(--transition-smooth) forwards; opacity: 0; }
.delay-1 { animation-delay: 0.05s; } .delay-2 { animation-delay: 0.1s; } .delay-3 { animation-delay: 0.15s; } .delay-4 { animation-delay: 0.2s; }
.animate-spin { animation: spin 1s linear infinite; }

/* Reader Content */
.reader-view { font-family: var(--font-sans); line-height: 1.75; font-size: 1.125rem; color: var(--fg-primary); }
.reader-view h1, .reader-view h2, .reader-view h3 { line-height: 1.3; font-weight: 600; margin-top: 2em; margin-bottom: 0.5em; color: var(--fg-primary); }
.reader-view h1 { font-size: 2.25rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 0.5rem; }
.reader-view h2 { font-size: 1.75rem; }
.reader-view p { margin: 1em 0; text-align: justify; }
.reader-view code { font-family: var(--font-mono); background: var(--glass-bg); padding: 0.15em 0.4em; border-radius: 0.25rem; font-size: 0.9em; border: 1px solid var(--glass-border); }
.reader-view pre { background: #05070c; border: 1px solid var(--glass-border); border-radius: var(--radius-xl); padding: 1.5rem; overflow-x: auto; margin: 1.5rem 0; }
.reader-view pre code { background: transparent; padding: 0; border: none; font-size: 0.875rem; line-height: 1.6; }
.reader-view blockquote { border-left: 3px solid var(--accent); padding-left: 1rem; margin: 1.5rem 0; color: var(--fg-muted); font-style: italic; }
.reader-view img { max-width: 100%; border-radius: var(--radius-xl); margin: 1.5rem auto; display: block; box-shadow: var(--shadow-glass); }

/* Sepia Reader Override */
html.sepia .reader-view { --fg-primary: #433422; color: #433422; }
html.sepia .reader-view h1, html.sepia .reader-view h2, html.sepia .reader-view h3 { color: #2c2010; }
html.sepia .reader-view code { background: #e8dfc9; border-color: #d4c9b0; }
html.sepia .reader-view pre { background: #2c2010; border-color: #d4c9b0; }
html.sepia .reader-view blockquote { border-color: #d4a843; color: #6b5b3a; }

/* Focus */
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
</style>

// GLOBAL ERROR HANDLING (Visual Feedback)
// ==========================================
window.addEventListener('error', e => showFatalError(e.error || e.message));
window.addEventListener('unhandledrejection', e => showFatalError(e.reason));
function showFatalError(err) {
  console.error('[FATAL]', err);
  document.getElementById('loading-shell').style.display = 'none';
  document.getElementById('error-shell').classList.remove('hidden');
  document.getElementById('error-msg').textContent = err.stack || String(err);
}

// ==========================================
// STATE & REACTIVITY
// ==========================================
const state = {
  view: 'dashboard', sidebarOpen: true, sidebarCollapsed: false, theme: 'dark',
  books: [], selectedBook: null, isUploading: false, uploadProgress: 0,
  stats: { totalBooks: 0, totalHours: 0, streak: 0, xp: 0 },
  reader: { type: null, currentLocation: null, totalPages: 0, fontSize: 100, theme: 'dark', toc: [], searchQuery: '', searchResults: [], searchIndex: -1, pdfDoc: null, epubRendition: null, epubBook: null },
};
const listeners = new Set();
const emit = () => listeners.forEach(fn => fn());
const subscribe = (fn) => { listeners.add(fn); return () => listeners.delete(fn); };
const setState = (patch) => { Object.assign(state, patch); emit(); };

// ==========================================
// INDEXEDDB (idb loaded dynamically)
// ==========================================
let dbPromise = null;
async function getDB() {
  if (dbPromise) return dbPromise;
  // Load idb dynamically
  const { openDB } = await import('https://cdn.jsdelivr.net/npm/idb@7/+esm');
  dbPromise = openDB('SnapLearnDB', 1, {
    upgrade(db) {
      if (!db.objectStoreNames.contains('books')) {
        const store = db.createObjectStore('books', { keyPath: 'id' });
        store.createIndex('title', 'title'); store.createIndex('addedAt', 'addedAt');
      }
      if (!db.objectStoreNames.contains('progress')) db.createObjectStore('progress', { keyPath: 'bookId' });
    },
  });
  return dbPromise;
}
async function saveBook(file, meta) {
  const db = await getDB();
  const id = crypto.randomUUID();
  const book = { id, title: meta.title || file.name.replace(/\.[^/.]+$/, ""), author: meta.author || "Unknown", type: meta.type || file.type, cover: meta.cover, fileSize: file.size, addedAt: Date.now(), updatedAt: Date.now(), fileBlob: file, searchText: (meta.searchText || '').substring(0, 500000), pageCount: meta.pageCount || 0 };
  await db.put('books', book);
  return book;
}
async function getBooks() { const db = await getDB(); return db.getAllFromIndex('books', 'addedAt'); }
async function getBook(id) { const db = await getDB(); return db.get('books', id); }
async function deleteBook(id) { const db = await getDB(); await db.delete('books', id); await db.delete('progress', id); }
async function saveProgress(bookId, loc, perc) { const db = await getDB(); await db.put('progress', { bookId, location: loc, percentage: perc, timestamp: Date.now() }); }
async function getProgress(bookId) { const db = await getDB(); return db.get('progress', bookId); }

// ==========================================
// PARSING ENGINE (Dynamic Imports)
// ==========================================
async function parseTextbook(file) {
  setState({ isUploading: true, uploadProgress: 10 });
  let meta = { title: file.name, searchText: '', pageCount: 0, cover: null };
  try {
    if (file.type === 'application/pdf' || file.name.endsWith('.pdf')) meta = await parsePDF(file);
    else if (file.type === 'application/epub+zip' || file.name.endsWith('.epub')) meta = await parseEPUB(file);
    else if (file.type.startsWith('text/') || file.name.endsWith('.md') || file.name.endsWith('.txt')) meta = await parseText(file);
    else throw new Error(`Unsupported: ${file.type}`);
  } catch (e) { alert(`Failed to parse ${file.name}: ${e.message}`); setState({ isUploading: false }); return null; }
  setState({ uploadProgress: 90 });
  const book = await saveBook(file, meta);
  setState({ isUploading: false, uploadProgress: 0 });
  return book;
}

async function parsePDF(file) {
  const pdfjsLib = await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/+esm');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs';
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  let fullText = ''; const numPages = pdf.numPages;
  for (let i = 1; i <= Math.min(numPages, 5); i++) { const page = await pdf.getPage(i); const content = await page.getTextContent(); fullText += content.items.map(s => s.str).join(' ') + '\n\n'; }
  const page1 = await pdf.getPage(1); const viewport = page1.getViewport({ scale: 0.4 });
  const canvas = document.createElement('canvas'); canvas.width = viewport.width; canvas.height = viewport.height;
  await page1.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  const cover = canvas.toDataURL('image/webp', 0.8);
  return { title: file.name, pageCount: numPages, cover, searchText: fullText, type: 'pdf' };
}

async function parseEPUB(file) {
  const EpubModule = await import('https://cdn.jsdelivr.net/npm/epubjs@0.3.93/+esm');
  const Epub = EpubModule.default || EpubModule; // Handle both default and named
  const url = URL.createObjectURL(file);
  const book = Epub(url);
  await book.ready;
  const metadata = book.package.metadata;
  const toc = await book.navigation.getToc();
  let cover = null;
  const coverUrl = book.coverUrl();
  if (coverUrl) { try { const resp = await fetch(coverUrl); const blob = await resp.blob(); cover = URL.createObjectURL(blob); } catch(e) {} }
  URL.revokeObjectURL(url);
  return { title: metadata.title || file.name, author: metadata.creator, pageCount: toc.length, cover, searchText: '', type: 'epub', toc }; // Pass TOC
}

async function parseText(file) {
  const text = await file.text();
  const { marked } = await import('https://cdn.jsdelivr.net/npm/marked@12/+esm');
  const DOMPurify = (await import('https://cdn.jsdelivr.net/npm/dompurify@3/+esm')).default;
  const html = DOMPurify.sanitize(marked.parse(text));
  const div = document.createElement('div'); div.innerHTML = html;
  return { title: file.name, searchText: div.innerText, type: 'markdown', pageCount: 1, cover: null };
}

            <button class="reader-btn p-2 rounded-lg ${r.theme === 'light' ? 'bg-white/10' : ''}" data-theme="light" aria-label="Light">${Icon('sun', 'w-4 h-4')}</button>
            <button class="reader-btn p-2 rounded-lg ${r.theme === 'sepia' ? 'bg-white/10' : ''}" data-theme="sepia" aria-label="Sepia">${Icon('coffee', 'w-4 h-4')}</button>
            <div class="w-px h-6 bg-white/10 mx-1"></div>
            <button class="reader-btn p-2 rounded-lg" data-font="down" aria-label="Smaller Font">${Icon('minus', 'w-4 h-4')}</button>
            <span class="px-2 text-xs font-mono text-muted-foreground">${r.fontSize}%</span>
            <button class="reader-btn p-2 rounded-lg" data-font="up" aria-label="Larger Font">${Icon('plus', 'w-4 h-4')}</button>
          </div>
          <button id="btn-toc" class="glass p-2 specular interactive" aria-label="Table of Contents">${Icon('list', 'w-5 h-5')}</button>
        </div>
      </header>
      <div class="flex-1 flex overflow-hidden relative">
        <aside id="toc-sidebar" class="w-64 glass-strong border-r border-glass-border flex flex-col hidden lg:flex transform transition-transform duration-300" style="transform: translateX(-100%);"><div class="p-3 border-b border-glass-border flex items-center justify-between"><h3 class="font-medium">Contents</h3><button id="btn-close-toc" class="p-1 rounded hover:bg-white/5" aria-label="Close TOC">${Icon('x', 'w-4 h-4')}</button></div><nav class="flex-1 overflow-y-auto glass-scroll p-3 space-y-1" id="toc-list">${r.toc.length ? r.toc.map((item, i) => `<a href="#" class="toc-link block px-3 py-2 rounded-lg text-sm hover:bg-white/5 text-muted-foreground hover:text-white transition-colors" data-href="${item.href}" data-index="${i}">${item.label}</a>`).join('') : '<p class="text-muted-foreground text-sm p-4">No chapters found</p>'}</nav></aside>
        <div class="flex-1 flex flex-col overflow-hidden" id="reader-content-wrapper">
          <div id="reader-content" class="flex-1 overflow-auto relative" style="background: var(--bg-base);"><div class="absolute inset-0 flex items-center justify-center text-muted-foreground" id="reader-loading"><div class="text-center"><div class="w-10 h-10 border-3 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto mb-2"></div><p>Loading textbook...</p></div></div></div>
          <div class="absolute bottom-0 left-0 right-0 h-1 bg-gradient-to-r from-indigo-500 to-pink-500 origin-left transform transition-transform duration-300" id="progress-bar" style="transform: scaleX(${r.percentage || 0}%)"></div>
        </div>
      </div>
    </div>
  `;
}

// ==========================================
// EVENT BINDING
// ==========================================
function bindEvents() {
  // Sidebar
  document.getElementById('btn-toggle-sidebar')?.addEventListener('click', () => setState({ sidebarCollapsed: !state.sidebarCollapsed }));
  document.getElementById('btn-mobile-menu')?.addEventListener('click', () => setState({ sidebarOpen: !state.sidebarOpen }));
  
  // Navigation
  document.querySelectorAll('.nav-btn').forEach(btn => btn.addEventListener('click', () => { navigate(btn.dataset.route); if (window.innerWidth < 1024) setState({ sidebarOpen: false }); }));
  
  // Theme
  document.getElementById('btn-theme')?.addEventListener('click', cycleTheme);
  document.querySelectorAll('.theme-option').forEach(btn => btn.addEventListener('click', () => setState({ theme: btn.dataset.theme })));

  // Upload
  document.getElementById('btn-upload')?.addEventListener('click', () => document.getElementById('file-input').click());
  document.getElementById('file-input')?.addEventListener('change', handleFiles);

  // Actions
  document.querySelectorAll('.action-btn').forEach(btn => btn.addEventListener('click', () => handleAction(btn.dataset.action)));

  // Book Cards (Event Delegation for dynamic content)
  document.getElementById('continue-grid')?.addEventListener('click', handleBookAction);
  document.getElementById('library-grid')?.addEventListener('click', handleBookAction);
  document.querySelectorAll('[data-action="resume"]').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); openReader(btn.dataset.bookId); }));

  // Settings
  document.getElementById('btn-export')?.addEventListener('click', exportLibrary);
  document.getElementById('btn-clear')?.addEventListener('click', clearAllData);

  // Reader
  document.getElementById('btn-close-reader')?.addEventListener('click', closeReader);
  document.getElementById('btn-toc')?.addEventListener('click', () => toggleTOC(true));
  document.getElementById('btn-close-toc')?.addEventListener('click', () => toggleTOC(false));
  document.querySelectorAll('#reader-overlay [data-theme]').forEach(btn => btn.addEventListener('click', () => setReaderTheme(btn.dataset.theme)));
  document.querySelectorAll('#reader-overlay [data-font]').forEach(btn => btn.addEventListener('click', () => adjustFont(btn.dataset.font)));
  document.getElementById('reader-search')?.addEventListener('input', debounce(handleReaderSearch, 300));
  document.querySelectorAll('.toc-link').forEach(a => a.addEventListener('click', (e) => { e.preventDefault(); navigateTOC(a.dataset.href, a.dataset.index); }));
  
  // Global Search
  document.getElementById('global-search')?.addEventListener('input', debounce(handleGlobalSearch, 300));

  // Click outside TOC/Reader
  document.getElementById('reader-overlay')?.addEventListener('click', (e) => { if (e.target === document.getElementById('reader-overlay')) closeReader(); });
}

function handleBookAction(e) {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  e.stopPropagation();
  const id = btn.dataset.bookId;
  if (btn.dataset.action === 'read') openReader(id);
  else if (btn.dataset.action === 'delete') confirmDelete(id);
}

// ==========================================
// LOGIC IMPLEMENTATIONS
// ==========================================
function navigate(route) { const views = { '/dashboard': 'dashboard', '/library': 'library', '/progress': 'progress', '/settings': 'settings' }; setState({ view: views[route] || 'dashboard' }); }
function cycleTheme() { const themes = ['dark', 'light', 'sepia']; const i = themes.indexOf(state.theme); setState({ theme: themes[(i + 1) % themes.length] }); }
function setReaderTheme(t) { state.reader.theme = t; document.documentElement.classList.toggle('sepia', t === 'sepia'); document.documentElement.classList.toggle('light', t === 'light'); render(); }

async function handleFiles(e) {
  const files = Array.from(e.target.files); if (!files.length) return; e.target.value = '';
  for (const file of files) { if (file.size > 500 * 1024 * 1024) { alert(`${file.name} is too large (>500MB).`); continue; } await parseTextbook(file); }
  await refreshBooks();
}

async function refreshBooks() { const books = await getBooks(); setState({ books, stats: { ...state.stats, totalBooks: books.length } }); updateStorageUI(); }

function handleAction(action) { if (action === 'upload') document.getElementById('file-input').click(); else if (action === 'import') document.getElementById('import-file').click(); else if (action === 'export') exportLibrary(); }

async function exportLibrary() {
  const books = await getBooks(); const db = await getDB(); const progress = await db.getAll('progress');
  const data = { books: books.map(b => ({...b, fileBlob: undefined})), progress, exportedAt: Date.now() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `snaplearn-backup-${Date.now()}.json`; a.click(); URL.revokeObjectURL(url);
}

window.handleImport = async (e) => {
  const file = e.target.files[0]; if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    const db = await getDB(); const tx = db.transaction(['books', 'progress'], 'readwrite');
    for (const b of data.books || []) await tx.objectStore('books').put({...b, fileBlob: null, cover: b.cover});
    for (const p of data.progress || []) await tx.objectStore('progress').put(p);
    await tx.done;
    alert('Metadata imported! Note: Actual book files must be re-uploaded.');
    await refreshBooks();
  } catch (err) { alert('Invalid backup file'); }
  e.target.value = '';
}

async function clearAllData() { if (!confirm('DELETE ALL BOOKS AND PROGRESS? This cannot be undone.')) return; const db = await getDB(); await db.clear('books'); await db.clear('progress'); await refreshBooks(); setState({ view: 'library' }); }
async function confirmDelete(id) { if (!confirm('Delete this textbook permanently?')) return; await deleteBook(id); await refreshBooks(); }

// ==========================================
// READER LOGIC (Simplified for Stability)
// ==========================================
async function openReader(bookId) {
  const book = await getBook(bookId); if (!book) return;
  setState({ view: 'reader', selectedBook: book, reader: { ...state.reader, type: book.type, toc: book.toc || [], percentage: 0 } });
  // Render overlay first, then load content
  await new Promise(r => requestAnimationFrame(r)); 
  loadReaderContent(book);
}

function closeReader() { 
  // Cleanup PDF/Epub instances
  if (state.reader.pdfDoc) { state.reader.pdfDoc.destroy(); state.reader.pdfDoc = null; }
  if (state.reader.epubRendition) { state.reader.epubRendition.destroy(); state.reader.epubRendition = null; }
  if (state.reader.epubBook) { state.reader.epubBook.destroy(); state.reader.epubBook = null; }
  setState({ view: 'library', selectedBook: null, reader: { ...state.reader, type: null, toc: [], pdfDoc: null, epubRendition: null, epubBook: null } }); 
}

function toggleTOC(open) { const el = document.getElementById('toc-sidebar'); if (el) el.style.transform = open ? 'translateX(0)' : 'translateX(-100%)'; }

async function loadReaderContent(book) {
  const container = document.getElementById('reader-content');
  const loading = document.getElementById('reader-loading');
  if (!container) return;
  
  try {
    if (book.type === 'pdf') await renderPDF(book, container, loading);
    else if (book.type === 'epub') await renderEPUB(book, container, loading);
    else if (book.type === 'markdown') renderMarkdown(book, container, loading);
  } catch (e) { console.error("Reader Load Error", e); container.innerHTML = `<div class="p-8 text-center text-red-400">Failed to load: ${e.message}</div>`; if(loading) loading.remove(); }
}

async function renderPDF(book, container, loadingEl) {
  const pdfjsLib = await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/+esm');
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs';
  
  const arrayBuffer = await book.fileBlob.arrayBuffer();
  const pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  state.reader.pdfDoc = pdfDoc;
  state.reader.totalPages = pdfDoc.numPages;
  
  if (loadingEl) loadingEl.remove();
  
  // Render all pages (simple implementation, virtualized would be better for 1000+ pages)
  const frag = document.createDocumentFragment();
  for (let i = 1; i <= pdfDoc.numPages; i++) {
    const page = await pdfDoc.getPage(i);
    const viewport = page.getViewport({ scale: 1.5 });
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width; canvas.height = viewport.height;
    canvas.className = 'mx-auto my-4 shadow-[var(--shadow-glass)] rounded-lg';
    const ctx = canvas.getContext('2d');
    await page.render({ canvasContext: ctx, viewport }).promise;
    frag.appendChild(canvas);
  }
  container.appendChild(frag);
  container.classList.add('px-8', 'py-8');
  setupScrollTracking(container, pdfDoc.numPages);
}

async function renderEPUB(book, container, loadingEl) {
  const EpubModule = await import('https://cdn.jsdelivr.net/npm/epubjs@0.3.93/+esm');
  const Epub = EpubModule.default || EpubModule;
  const url = URL.createObjectURL(book.fileBlob);
  const epubBook = Epub(url);
  await epubBook.ready;
  state.reader.epubBook = epubBook;
  
  const rendition = epubBook.renderTo('reader-content', { width: '100%', height: '100%', spread: 'auto', minSpreadWidth: 800 });
  state.reader.epubRendition = rendition;
  
  rendition.on('rendered', (section) => {
    if (loadingEl) loadingEl.remove();
    // Update progress
    const loc = epubBook.locations.locationFromCfi(section.contents.cfi);
    const perc = loc ? (loc.start / loc.total) * 100 : 0;
    updateProgressBar(perc);
  });
  
  rendition.on('relocated', (loc) => { saveProgress(book.id, loc.startCfi, (loc.location.start / loc.location.total) * 100); });
  
  // Restore progress
  const prog = await getProgress(book.id);
  if (prog?.location) rendition.display(prog.location);
  else rendition.display();
}

function renderMarkdown(book, container, loadingEl) {
  if (loadingEl) loadingEl.remove();
  container.classList.add('reader-view', 'p-8', 'max-w-3xl', 'mx-auto');
  const { marked } = await import('https://cdn.jsdelivr.net/npm/marked@12/+esm');
  const DOMPurify = (await import('https://cdn.jsdelivr.net/npm/dompurify@3/+esm')).default;
  container.innerHTML = DOMPurify.sanitize(marked.parse(await book.fileBlob.text()));
  setupScrollTracking(container, 1);
}

function setupScrollTracking(container, totalPages) {
  container.addEventListener('scroll', debounce(() => {
    const scrollTop = container.scrollTop;
    const scrollHeight = container.scrollHeight - container.clientHeight;
    const perc = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
    updateProgressBar(perc);
    if (state.selectedBook) saveProgress(state.selectedBook.id, { scrollTop }, perc);
  }, 200), { passive: true });
}

function updateProgressBar(perc) { const bar = document.getElementById('progress-bar'); if (bar) bar.style.transform = `scaleX(${Math.min(100, Math.max(0, perc))}%)`; }

function adjustFont(dir) { const step = 10; const newSize = Math.max(50, Math.min(200, state.reader.fontSize + (dir === 'up' ? step : -step))); setState({ reader: { ...state.reader, fontSize: newSize } }); document.getElementById('reader-content').style.fontSize = newSize + '%'; }

function handleReaderSearch() { const q = document.getElementById('reader-search').value; state.reader.searchQuery = q; alert(`Search for "${q}" - Implement full text search in reader content`); }
function navigateTOC(href, index) { if (state.reader.epubRendition) state.reader.epubRendition.display(href); toggleTOC(false); }
function handleGlobalSearch() { const q = document.getElementById('global-search').value.toLowerCase(); const filtered = state.books.filter(b => b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q)); document.getElementById('library-grid').innerHTML = filtered.length ? filtered.map(b => BookCard(b, false)).join('') : EmptyState('No Results', `No books matching "${q}"`, 'search'); }
function debounce(fn, ms) { let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); }; }

async function updateStorageUI() {
  try {
    if (navigator.storage && navigator.storage.estimate) {
      const est = await navigator.storage.estimate();
      const used = est.usage || 0; const quota = est.quota || 1;
      const pct = (used / quota) * 100;
      const usedEl = document.getElementById('storage-used'); const barEl = document.getElementById('storage-bar');
      if (usedEl) usedEl.textContent = `${formatBytes(used)} / ${formatBytes(quota)}`;
      if (barEl) barEl.style.width = `${Math.min(100, pct)}%`;
    }
  } catch(e) { /* ignore */ }
}

// ==========================================
// INITIALIZATION
// ==========================================
async function init() {
  try {
    await refreshBooks();
    // Subscribe to state changes for re-render
    subscribe(render);
    // Initial render
    render();
  } catch (e) { showFatalError(e); }
}

init();
</script>
